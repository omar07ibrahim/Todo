<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tasks and Baku weather</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <main class="container mt-5">
        <div class="row">
            <section class="col-md-7" aria-labelledby="tasks-heading">
                <h1 id="tasks-heading">Tasks</h1>
                <form method="post" action="/add_task">
                    <div class="input-group mb-3">
                        <label class="sr-only" for="new-task">New task</label>
                        <input id="new-task" type="text" name="task" maxlength="200" class="form-control" placeholder="Add a task" required>
                        <div class="input-group-append">
                            <button type="submit" class="btn btn-primary">Add</button>
                        </div>
                    </div>
                </form>
                <ul class="list-group">
                    {% for task in tasks %}
                    <li class="list-group-item{% if task.done %} list-group-item-success{% endif %}">
                        {{ task.task }}
                        <div class="float-right d-flex">
                            <a href="/edit_task/{{ task.id }}" class="btn btn-warning btn-sm mr-1">Edit</a>
                            <form method="post" action="/toggle_task/{{ task.id }}" class="mr-1">
                                <button type="submit" class="btn btn-success btn-sm">Toggle</button>
                            </form>
                            <form method="post" action="/delete_task/{{ task.id }}">
                                <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                            </form>
                        </div>
                    </li>
                    {% else %}
                    <li class="list-group-item text-muted">No tasks yet.</li>
                    {% endfor %}
                </ul>
            </section>
            <section class="col-md-5" aria-labelledby="weather-heading">
                <h2 id="weather-heading">Baku weather</h2>
                <p id="weather-info" aria-live="polite">Weather has not been requested.</p>
                <button class="btn btn-primary" id="get-weather" type="button">Get weather</button>
            </section>
        </div>
    </main>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script>
        $(function() {
            $('#get-weather').on('click', function() {
                $.ajax({
                    url: '/get_weather',
                    type: 'GET',
                    success: function(response) { $('#weather-info').text(response); },
                    error: function() { $('#weather-info').text('Weather request failed.'); }
                });
            });
        });
    </script>
</body>
</html>
