name: PlanForge quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: planforge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile every Python source
        run: python -m compileall -q planforge tests
      - name: Run the complete dependency-free suite
        run: python -m unittest discover -s tests -v

  distribution:
    name: Distribution and installed CLI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up exact build Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.2.0
        with:
          python-version: "3.12.3"
      - name: Install exact build-only tools
        run: python -m pip install --no-deps -r requirements/build-tools.txt
      - name: Build wheel and source archive without isolation drift
        run: python -m build --no-isolation --outdir "$RUNNER_TEMP/planforge-dist"
      - name: Verify archives and execute the installed wheel outside checkout
        run: python scripts/verify_distribution.py --dist "$RUNNER_TEMP/planforge-dist"
