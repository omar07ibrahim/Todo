name: Refresh PlanForge evidence

on:
  push:
    branches: [portfolio/planforge-exact-planner]

permissions:
  contents: write

concurrency:
  group: planforge-evidence-refresh
  cancel-in-progress: false

jobs:
  capture:
    if: github.event.head_commit.message == 'Trigger hosted PlanForge evidence capture' && github.actor == 'omar07ibrahim'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CONTAINER_IMAGE: mcr.microsoft.com/playwright/python@sha256:51d31fdfacb0cff99a1a724152e34ae408d2bd4e7da310ff157450f49261cc59
    steps:
      - name: Check out the authorized revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Assert owner, branch, revision, and source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = "omar07ibrahim"
          test "$GITHUB_REF" = "refs/heads/portfolio/planforge-exact-planner"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git symbolic-ref -q HEAD || true)"
          SOURCE_REVISION="$(git log -1 --format=%H -- \
            docs/planning-contract.md \
            examples/launch-day.request.json \
            planforge \
            requirements/evidence-browser.txt \
            requirements/evidence-browser-image.lock.json \
            scripts/generate_planforge_evidence.py \
            scripts/verify_planforge_evidence.py)"
          SOURCE_TREE="$(git rev-parse "$SOURCE_REVISION^{tree}")"
          for value in "$SOURCE_REVISION" "$SOURCE_TREE"; do
            test "${#value}" -eq 40
            case "$value" in *[!0-9a-f]*) exit 1;; esac
          done
          echo "SOURCE_REVISION=$SOURCE_REVISION" >>"$GITHUB_ENV"
          echo "SOURCE_TREE=$SOURCE_TREE" >>"$GITHUB_ENV"

      - name: Set up exact wheel-download Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.2.0
        with:
          python-version: "3.12.3"

      - name: Download the hash-locked evidence wheels
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence-wheelhouse"
          python -m pip download \
            --require-hashes \
            --only-binary=:all: \
            --dest "$RUNNER_TEMP/evidence-wheelhouse" \
            -r requirements/evidence-browser.txt
          test "$(find "$RUNNER_TEMP/evidence-wheelhouse" -maxdepth 1 -type f | wc -l)" -eq 5

      - name: Pull the platform-pinned browser image
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "$CONTAINER_IMAGE"
          test "$(docker image inspect "$CONTAINER_IMAGE" --format '{{.Architecture}}/{{.Os}}')" = "amd64/linux"

      - name: Capture and independently verify twice
        shell: bash
        run: |
          set -euo pipefail
          candidates="$RUNNER_TEMP/planforge-evidence"
          mkdir -p "$candidates"
          for label in a b; do
            docker run --rm \
              --platform linux/amd64 \
              --pull=never \
              --network=none \
              --read-only \
              --cap-drop=ALL \
              --security-opt=no-new-privileges \
              --pids-limit=512 \
              --memory=4g \
              --cpus=2 \
              --shm-size=1g \
              --tmpfs /tmp:rw,exec,nosuid,nodev,size=2147483648 \
              --user "$(id -u):$(id -g)" \
              --env HOME=/tmp/home \
              --env PYTHONNOUSERSITE=1 \
              --env PYTHONPATH=/src:/tmp/evidence-python \
              --volume "$GITHUB_WORKSPACE:/src:ro" \
              --volume "$RUNNER_TEMP/evidence-wheelhouse:/wheelhouse:ro" \
              --volume "$candidates:/out:rw" \
              --entrypoint bash \
              "$CONTAINER_IMAGE" \
              -euo pipefail -c '
                mkdir -p "$HOME" /tmp/evidence-python
                python -m pip install \
                  --no-index \
                  --find-links=/wheelhouse \
                  --target=/tmp/evidence-python \
                  Pillow==12.3.0 \
                  playwright==1.62.0
                python /src/scripts/generate_planforge_evidence.py \
                  --output-root "/out/'"$label"'" \
                  --source-revision "'"$SOURCE_REVISION"'" \
                  --source-tree "'"$SOURCE_TREE"'" \
                  --container-image "'"$CONTAINER_IMAGE"'"
                python /src/scripts/verify_planforge_evidence.py verify \
                  "/out/'"$label"'" \
                  --source-revision "'"$SOURCE_REVISION"'" \
                  --source-tree "'"$SOURCE_TREE"'"
              '
          done
          test "$(find "$candidates/a" -type f | wc -l)" -eq 11
          test "$(find "$candidates/b" -type f | wc -l)" -eq 11
          test -z "$(find "$candidates" -type l -print -quit)"
          while IFS= read -r relative; do
            cmp "$candidates/a/$relative" "$candidates/b/$relative"
          done <<'FILES'
          docs/assets/planforge-dashboard.png
          docs/assets/planforge-mobile.png
          docs/assets/planforge-full-page.png
          docs/assets/planforge-interaction.gif
          docs/assets/planforge-cli.png
          docs/assets/planforge-gantt.svg
          docs/assets/planforge-horizon-curve.svg
          docs/assets/planforge-proof-flow.svg
          docs/assets/planforge-plan.json
          docs/assets/planforge-verification.json
          docs/assets/planforge-evidence.json
          FILES

      - name: Adopt only the verified evidence inventory
        shell: bash
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/planforge-evidence/a"
          while IFS= read -r relative; do
            install -D -m 0644 "$candidate/$relative" "$relative"
            git add -- "$relative"
          done <<'FILES'
          docs/assets/planforge-dashboard.png
          docs/assets/planforge-mobile.png
          docs/assets/planforge-full-page.png
          docs/assets/planforge-interaction.gif
          docs/assets/planforge-cli.png
          docs/assets/planforge-gantt.svg
          docs/assets/planforge-horizon-curve.svg
          docs/assets/planforge-proof-flow.svg
          docs/assets/planforge-plan.json
          docs/assets/planforge-verification.json
          docs/assets/planforge-evidence.json
          FILES
          test -z "$(git diff --name-only)"
          actual="$(git diff --cached --name-only)"
          expected="$(sed 's/^          //' <<'FILES'
          docs/assets/planforge-cli.png
          docs/assets/planforge-dashboard.png
          docs/assets/planforge-evidence.json
          docs/assets/planforge-full-page.png
          docs/assets/planforge-gantt.svg
          docs/assets/planforge-horizon-curve.svg
          docs/assets/planforge-interaction.gif
          docs/assets/planforge-mobile.png
          docs/assets/planforge-plan.json
          docs/assets/planforge-proof-flow.svg
          docs/assets/planforge-verification.json
          FILES
          )"
          test "$actual" = "$expected"
          git diff --cached --check

      - name: Commit exact candidate as Omar Ibrahim
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: Omar Ibrahim
          GIT_AUTHOR_EMAIL: 31526072+omar07ibrahim@users.noreply.github.com
          GIT_COMMITTER_NAME: Omar Ibrahim
          GIT_COMMITTER_EMAIL: 31526072+omar07ibrahim@users.noreply.github.com
        run: |
          set -euo pipefail
          git commit -m "Publish reproducible PlanForge evidence"
          test "$(git show -s --format='%an <%ae>%n%cn <%ce>' HEAD)" = "Omar Ibrahim <31526072+omar07ibrahim@users.noreply.github.com>
          Omar Ibrahim <31526072+omar07ibrahim@users.noreply.github.com>"
          gh auth setup-git
          git push origin HEAD:refs/heads/portfolio/planforge-exact-planner
