<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500"><title>PlanForge proof architecture</title><desc>Source-bound architecture annotated with observed search metrics.</desc><rect width="1200" height="500" rx="24" fill="#080d19"/><text x="46" y="54" fill="#61d6a8" font-size="14" font-weight="700">OBSERVED PROOF PIPELINE</text><text x="46" y="91" fill="#f7f8fc" font-size="27" font-weight="700">One claim, two different algorithms, one receipt</text><rect x="46" y="170" width="230" height="150" rx="18" fill="#111a2d" stroke="#33415f"/><text x="66" y="218" fill="#f7f8fc" font-size="19" font-weight="700">Bounded request</text><text x="66" y="254" fill="#9aa8c4" font-size="13">strict schema + DAG</text><path d="M276 245H316" stroke="#61d6a8" stroke-width="4"/><path d="M308 237L320 245L308 253" fill="none" stroke="#61d6a8" stroke-width="4"/><rect x="326" y="170" width="230" height="150" rx="18" fill="#111a2d" stroke="#33415f"/><text x="346" y="218" fill="#f7f8fc" font-size="19" font-weight="700">Exact planner</text><text x="346" y="254" fill="#9aa8c4" font-size="13">179 states</text><path d="M556 245H596" stroke="#61d6a8" stroke-width="4"/><path d="M588 237L600 245L588 253" fill="none" stroke="#61d6a8" stroke-width="4"/><rect x="606" y="170" width="230" height="150" rx="18" fill="#111a2d" stroke="#33415f"/><text x="626" y="218" fill="#f7f8fc" font-size="19" font-weight="700">Independent verifier</text><text x="626" y="254" fill="#9aa8c4" font-size="13">179 feasible sequences</text><path d="M836 245H876" stroke="#61d6a8" stroke-width="4"/><path d="M868 237L880 245L868 253" fill="none" stroke="#61d6a8" stroke-width="4"/><rect x="886" y="170" width="230" height="150" rx="18" fill="#111a2d" stroke="#33415f"/><text x="906" y="218" fill="#f7f8fc" font-size="19" font-weight="700">Hash receipt</text><text x="906" y="254" fill="#9aa8c4" font-size="13">910c86ad7e36...</text><text x="46" y="438" fill="#8290ac" font-size="13">The verifier does not call the branch-and-bound solver; it enumerates feasible permutations independently.</text></svg>